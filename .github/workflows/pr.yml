name: CI
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  # see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the upstream larger-runner tuning; use one Nx task per core on the fork's Ubuntu runner.
  NX_PARALLEL: ${{ github.repository_owner == 'mainframev' && '4' || '6' }}
  NX_VERBOSE_LOGGING: true

  # Nx already runs tasks concurrently, so use one Jest worker per task on the 4-core fork runner.
  FLUENT_JEST_WORKER: ${{ github.repository_owner == 'mainframev' && '1' || '2' }}

  BROWSERSLIST_IGNORE_OLD_DATA: true

  DEPLOY_HOST: fluentuipr.z22.web.core.windows.net
  DEPLOY_URL: https://fluentuipr.z22.web.core.windows.net/${{ github.event.pull_request.number || github.ref_name }}
  DEPLOY_BASE_PATH: ${{ github.event.pull_request.number != '' && format('pull/{0}', github.event.pull_request.number) || format('heads/{0}', github.ref_name) }}

jobs:
  main:
    # upstream repo + the fork used to validate large migrations before they are opened upstream
    if: ${{ github.repository_owner == 'microsoft' || github.repository_owner == 'mainframev' }}
    runs-on: ${{ github.repository_owner == 'mainframev' && 'ubuntu-latest' || 'macos-14-xlarge' }}
    timeout-minutes: 300
    permissions:
      contents: 'read'
      actions: 'read'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: echo number of CPUs "$(getconf _NPROCESSORS_ONLN)"

      - run: yarn install --frozen-lockfile

      - name: Workspace lint
        run: |
          yarn nx run workspace-plugin:check-graph
          yarn nx g @fluentui/workspace-plugin:tsconfig-base-all --verify
          yarn nx g @fluentui/workspace-plugin:normalize-package-dependencies --verify

      - name: Type-check just.config.ts files
        run: |
          # following packages need to be build in advance:
          # @fluentui/api-docs is used within apps/public-docsite-resources/just.config.ts,
          # @fluentui/digest is used within packages/fluentui/perf-test-northstar/just.config.ts, thus it needs to be build in advance
          #
          # NOTE: we are running this via nx in order to get cache hits later on
          yarn nx run-many -t build -p api-docs digest
          yarn tsc -p ./tsconfig.just-scripts-configs.json

      - name: 'check packages: installed dependencies versions'
        run: |
          yarn check:installed-dependencies-versions

      - name: check formatting
        run: |
          yarn nx format:check --base origin/master

      - name: build, test, lint, test-ssr (affected)
        run: |
          yarn nx affected -t build test lint type-check test-ssr test-integration verify-packaging --nxBail

      - name: 'Check for unstaged changes'
        run: |
          git status --porcelain
          git diff-index --quiet HEAD -- || exit 1

  type-check-benchmark:
    name: TypeScript benchmark
    if: ${{ github.repository_owner == 'mainframev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NX_PARALLEL: 4
      NX_VERBOSE_LOGGING: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          cache: yarn
          node-version: 22

      - run: yarn install --frozen-lockfile

      - name: Report TypeScript version
        run: yarn tsc --version

      - name: Run uncached workspace type-check
        shell: bash
        run: |
          started_at=$(date +%s)
          set +e
          yarn nx run-many -t type-check --all --parallel="$NX_PARALLEL" --skip-nx-cache
          status=$?
          set -e
          duration_seconds=$(($(date +%s) - started_at))

          {
            echo "## TypeScript type-check benchmark"
            echo
            echo "- Duration: ${duration_seconds} seconds"
            echo "- Parallelism: ${NX_PARALLEL}"
            echo "- Nx cache: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

  react-compiler-analyzer:
    # upstream repo + the fork used to validate large migrations before they are opened upstream
    if: ${{ github.repository_owner == 'microsoft' || github.repository_owner == 'mainframev' }}
    runs-on: ${{ github.repository_owner == 'mainframev' && 'ubuntu-latest' || 'macos-14-xlarge' }}
    timeout-minutes: 120
    permissions:
      contents: 'read'
      actions: 'read'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: yarn install --frozen-lockfile

      - name: React Compiler analysis (affected)
        run: |
          yarn nx affected -t react-compiler-analyzer--lint --nxBail

  react-major-versions-integration:
    # upstream repo + the fork used to validate large migrations before they are opened upstream
    if: ${{ github.repository_owner == 'microsoft' || github.repository_owner == 'mainframev' }}
    runs-on: ${{ github.repository_owner == 'mainframev' && 'ubuntu-latest' || 'macos-14-xlarge' }}
    timeout-minutes: 300
    permissions:
      contents: 'read'
      # required by `nrwl/nx-set-shas` to look up the last successful workflow run
      actions: 'read'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: echo number of CPUs "$(getconf _NPROCESSORS_ONLN)"

      # this job installs 2 additional React workspaces (+ 2 Cypress binaries) next to the
      # workspace `node_modules`, which does not fit next to the preinstalled SDKs of the image
      - name: Free up runner disk space
        if: ${{ github.repository_owner == 'mainframev' }}
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - run: |
          yarn install --frozen-lockfile
          yarn rit --react 17 --install-deps
          yarn rit --react 18 --install-deps

      - name: Verify Cypress installs from RIT temp workspaces (React 17 -> v13, React 18 -> v14)
        run: |
          "$GITHUB_WORKSPACE"/tmp/rit/react-17/node_modules/.bin/cypress verify
          "$GITHUB_WORKSPACE"/tmp/rit/react-18/node_modules/.bin/cypress verify

      - name: React Versions Integration Tests (17,18) - E2E
        id: e2e
        run: |
          yarn nx affected -t test-rit--17--e2e,test-rit--18--e2e --exclude='react-19-tests-v9,react-charting,react'

      - name: Upload Cypress screenshots if exist
        uses: actions/upload-artifact@v6
        if: always() && steps.e2e.outcome == 'failure'
        with:
          name: cypress-screenshots-react-test-rit
          path: |
            tmp/rit/**/cypress/screenshots/**/*.png
          retention-days: 1

      - name: React Versions Integration Tests (17,18) - Type-check & Test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # Each task gets a 4 GB heap, so limit the 16 GB fork runner while preserving upstream tuning.
        run: |
          yarn nx affected -t test-rit--17--type-check,test-rit--18--type-check,test-rit--17--test,test-rit--18--test --exclude='react-19-tests-v9' --parallel=${{ github.repository_owner == 'mainframev' && '2' || '6' }}

  e2e:
    # upstream repo + the fork used to validate large migrations before they are opened upstream
    if: ${{ github.repository_owner == 'microsoft' || github.repository_owner == 'mainframev' }}
    # NOTE: this job was already running on ubuntu
    # https://github.com/microsoft/fluentui/issues/33173
    # https://github.com/microsoft/fluentui/issues/33172
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: 'read'
      actions: 'read'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: echo number of CPUs "$(getconf _NPROCESSORS_ONLN)"

      - run: yarn install --frozen-lockfile

      - name: Install Playwright dependencies
        run: yarn playwright install --with-deps

      - name: Verify Cypress install
        run: yarn cypress verify

      - name: Cypress/Playwright E2E tests
        run: yarn nx affected -t e2e --nxBail --parallel 1

      - name: Upload Cypress screenshots if exist
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-screenshots
          path: |
            apps/*/cypress/screenshots/**/*.png
            packages/**/cypress/screenshots/**/*.png
          retention-days: 1
