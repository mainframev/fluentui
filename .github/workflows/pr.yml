name: CI
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  # see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_PARALLEL: 6 # ubuntu-latest = 4-core CPU / 16 GB of RAM | macos-14-xlarge (arm) = 6-core CPU / 14 GB of RAM
  NX_PREFER_TS_NODE: true
  NX_VERBOSE_LOGGING: true

  BROWSERSLIST_IGNORE_OLD_DATA: true

  DEPLOY_HOST: fluentuipr.z22.web.core.windows.net
  DEPLOY_URL: https://fluentuipr.z22.web.core.windows.net/${{ github.event.pull_request.number || github.ref_name }}
  DEPLOY_BASE_PATH: ${{ github.event.pull_request.number != '' && format('pull/{0}', github.event.pull_request.number) || format('heads/{0}', github.ref_name) }}

jobs:
  main:
    if: ${{ github.repository_owner == 'microsoft' }}
    runs-on: macos-14-xlarge
    permissions:
      contents: 'read'
      actions: 'read'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: echo number of CPUs "$(getconf _NPROCESSORS_ONLN)"

      - run: yarn install --immutable

      - name: Workspace lint
        run: |
          yarn nx run workspace-plugin:check-graph
          yarn nx g @fluentui/workspace-plugin:tsconfig-base-all --verify
          yarn nx g @fluentui/workspace-plugin:normalize-package-dependencies --verify

      - name: Type-check just.config.ts files
        run: |
          # following packages need to be build in advance:
          # @fluentui/api-docs is used within apps/public-docsite-resources/just.config.ts,
          # @fluentui/digest is used within packages/fluentui/perf-test-northstar/just.config.ts, thus it needs to be build in advance
          #
          # NOTE: we are running this via nx in order to get cache hits later on
          yarn nx run-many -t build -p api-docs digest
          yarn tsc -p ./tsconfig.just-scripts-configs.json

      - name: 'check packages: installed dependencies versions'
        run: |
          yarn check:installed-dependencies-versions

      - name: check formatting
        run: |
          yarn nx format:check --base origin/master

      - name: build, test, lint, test-ssr (affected)
        run: |
          FLUENT_JEST_WORKER=2 yarn nx affected -t build test lint type-check test-ssr test-integration verify-packaging verify-bundle-isolation --nxBail

      - name: 'Check for unstaged changes'
        run: |
          git status --porcelain
          git diff-index --quiet HEAD -- || exit 1

  react-compiler-analyzer:
    if: ${{ github.repository_owner == 'microsoft' }}
    runs-on: macos-14-xlarge
    permissions:
      contents: 'read'
      actions: 'read'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: yarn install --immutable

      - name: React Compiler analysis (affected)
        run: |
          yarn nx affected -t react-compiler-analyzer--lint --nxBail

  react-major-versions-integration:
    if: ${{ github.repository_owner == 'microsoft' }}
    runs-on: macos-14-xlarge
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: echo number of CPUs "$(getconf _NPROCESSORS_ONLN)"

      - run: |
          yarn install --immutable
      - run: |
          yarn rit --react 17 --install-deps
          yarn rit --react 18 --install-deps

      - name: Verify Cypress installs from RIT temp workspaces (React 17 -> v13, React 18 -> v14)
        run: |
          "$GITHUB_WORKSPACE"/tmp/rit/react-17/node_modules/.bin/cypress verify
          "$GITHUB_WORKSPACE"/tmp/rit/react-18/node_modules/.bin/cypress verify

      - name: React Versions Integration Tests (17,18) - E2E
        id: e2e
        run: |
          yarn nx affected -t test-rit--17--e2e,test-rit--18--e2e --exclude='react-19-tests-v9,react-charting,react'

      - name: Upload Cypress screenshots if exist
        uses: actions/upload-artifact@v6
        if: always() && steps.e2e.outcome == 'failure'
        with:
          name: cypress-screenshots-react-test-rit
          path: |
            tmp/rit/**/cypress/screenshots/**/*.png
          retention-days: 1

      - name: React Versions Integration Tests (17,18) - Type-check & Test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          FLUENT_JEST_WORKER=2 yarn nx affected -t test-rit--17--type-check,test-rit--18--type-check,test-rit--17--test,test-rit--18--test --exclude='react-19-tests-v9'

  e2e:
    if: ${{ github.repository_owner == 'microsoft' }}
    # TODO: switch to macos once problematic tests are fixed
    # https://github.com/microsoft/fluentui/issues/33173
    # https://github.com/microsoft/fluentui/issues/33172
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      actions: 'read'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: echo number of CPUs "$(getconf _NPROCESSORS_ONLN)"

      - run: yarn install --immutable

      - name: Install Playwright dependencies
        run: yarn playwright install --with-deps

      - name: Verify Cypress install
        run: yarn cypress verify

      - name: Cypress/Playwright E2E tests
        run: yarn nx affected -t e2e --nxBail --parallel 1

      - name: Upload Cypress screenshots if exist
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-screenshots
          path: |
            apps/*/cypress/screenshots/**/*.png
            packages/**/cypress/screenshots/**/*.png
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Lint performance benchmark (fork only).
  #
  # Measures the wall-clock cost of a full, uncached workspace lint so that the
  # delta introduced by a new ESLint rule can be quantified. Runs only in the
  # `mainframev` fork; every job above is gated on `microsoft` and therefore
  # skips there, leaving this job the whole runner.
  # ---------------------------------------------------------------------------
  lint-benchmark:
    name: Lint benchmark
    if: ${{ github.repository_owner == 'mainframev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: 'read'
      actions: 'read'

    env:
      # ubuntu-latest is a 4-core runner; the workflow-level default of 6 is tuned
      # for macos-14-xlarge. Pinned so both sides of the benchmark match exactly.
      NX_PARALLEL: 4
      # the workflow-level default of `true` adds I/O overhead and log noise
      NX_VERBOSE_LOGGING: false
      LINT_BENCHMARK_RUNS: 3
      TIMING_PACKAGE: packages/react-components/react-button/library

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - run: yarn install --immutable

      # NOT timed. `packages/eslint-plugin/src/configs/react/config.js` requires the
      # *built* `@fluentui/eslint-plugin-react-components`, so without this every
      # package consuming the react config dies with "Cannot find module" before
      # linting a single file. Nx builds this project's dependencies transitively.
      - name: Build lint prerequisites (not timed)
        run: yarn nx run-many -t build -p eslint-plugin-react-components

      - name: Record environment
        run: |
          {
            echo "## Lint benchmark environment"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Runner | \`${RUNNER_OS}\` / \`$(getconf _NPROCESSORS_ONLN)\` CPUs |"
            echo "| Node | \`$(node --version)\` |"
            echo "| ESLint | \`$(yarn run -T eslint --version)\` |"
            echo "| Nx parallelism | \`${NX_PARALLEL}\` |"
            echo "| Nx cache | disabled (\`--skipNxCache\`) |"
            echo "| Task dependencies | excluded (\`--excludeTaskDependencies\`) |"
            echo "| Projects with a \`lint\` target | \`$(yarn nx show projects --with-target lint | wc -l | tr -d ' ')\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Full workspace lint (timed, uncached)
        run: |
          {
            echo "## Full workspace lint"
            echo ""
            echo "\`yarn nx run-many -t lint --all --parallel=${NX_PARALLEL} --skipNxCache --excludeTaskDependencies\`"
            echo ""
            echo "| Run | Duration (s) | Failed tasks | Exit code |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          best=""

          for run in $(seq 1 "$LINT_BENCHMARK_RUNS"); do
            started_at=$(date +%s)

            set +e
            yarn nx run-many -t lint --all --parallel="$NX_PARALLEL" --skipNxCache --excludeTaskDependencies \
              2>&1 | tee "lint-run-${run}.log"
            status=${PIPESTATUS[0]}
            set -e

            duration=$(( $(date +%s) - started_at ))

            # A high count means projects died before linting anything (e.g. a missing
            # build), which would make the duration meaningless. Surfaced so the
            # measurement can be sanity-checked rather than trusted blindly.
            failed_tasks=$(grep -cE '^- \S+:lint$' "lint-run-${run}.log" || true)

            # echoed to stdout as well: step summaries are not retrievable via the API
            echo "BENCHMARK_RESULT run=${run} duration_seconds=${duration} failed_tasks=${failed_tasks} exit=${status}"
            echo "| ${run} | ${duration} | ${failed_tasks} | ${status} |" >> "$GITHUB_STEP_SUMMARY"

            rm -f "lint-run-${run}.log"

            if [ -z "$best" ] || [ "$duration" -lt "$best" ]; then
              best=$duration
            fi
          done

          echo "BENCHMARK_BEST duration_seconds=${best}"

          {
            echo ""
            echo "**Fastest run: ${best}s**"
            echo ""
            echo "> A non-zero exit code is expected when the benchmarked rule reports"
            echo "> violations. It does not affect the timing: no \`--nxBail\` is used, so"
            echo "> every project is linted on every run."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Per-rule timing (single package)
        working-directory: ${{ env.TIMING_PACKAGE }}
        run: |
          set +e
          TIMING=25 yarn run -T eslint src 2>&1 | tee eslint-timing.log
          set -e

          {
            echo "## Per-rule timing — \`${TIMING_PACKAGE}\`"
            echo ""
            echo "Runner-independent attribution from ESLint's built-in profiler"
            echo "(\`TIMING=25 eslint src\`)."
            echo ""
            echo '```'
            sed -n '/^Rule/,$p' eslint-timing.log
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f eslint-timing.log
