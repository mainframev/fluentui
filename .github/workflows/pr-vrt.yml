name: VRT PR
on:
  pull_request:
    branches:
      # Why only master - https://github.com/microsoft/fluentui/pull/34072#discussion_r2011220032
      - master

concurrency:
  # see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the upstream larger-runner tuning; limit memory-heavy Storybook/Playwright work on the fork.
  NX_PARALLEL: ${{ github.repository_owner == 'mainframev' && '2' || '6' }}
  NX_VERBOSE_LOGGING: true

permissions:
  contents: 'read'
  actions: 'read'

jobs:
  generate_vrt_screenshots:
    # upstream repo + the fork used to validate large migrations before they are opened upstream
    if: ${{ github.repository_owner == 'microsoft' || github.repository_owner == 'mainframev' }}
    # The fork validates screenshot generation on Ubuntu. Upstream stays on macOS to match its baseline.
    runs-on: ${{ github.repository_owner == 'mainframev' && 'ubuntu-latest' || 'macos-14-xlarge' }}
    name: Generate screenshots
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4.3.3
        with:
          main-branch-name: 'master'

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      # storybook builds + playwright browsers do not fit next to the preinstalled SDKs of the image
      - name: Free up runner disk space
        if: ${{ github.repository_owner == 'mainframev' }}
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps

      - name: Run VR tests (generate screenshots)
        run: yarn nx affected -t test-vr --nxBail

      - name: Prepare VR screenshots for upload
        uses: actions/github-script@v8
        id: screenshots_root
        with:
          script: |
            const run = require('./.github/scripts/prepare-vr-screenshots-for-upload');
            const config = {
              projects: ['vr-tests-web-components', 'vr-tests-react-components', 'vr-tests']
            };
            const result = await run({github,context,core,config});
            return result;
          result-encoding: string

      - name: Upload VR screenshots
        uses: actions/upload-artifact@v6
        with:
          name: vrscreenshot
          retention-days: 1
          path: ${{steps.screenshots_root.outputs.result}}

      - name: Save PR number
        run: echo ${{ github.event.number }} > pr.txt

      - uses: actions/upload-artifact@v6
        with:
          name: pr-number
          retention-days: 1
          if-no-files-found: error
          path: |
            pr.txt
